name: Build KasirSayuran APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q KasirSayuran_Android_Project.zip
          cd KasirSayuran

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")

          p.write_text(s)
          print("Java/Kotlin target disesuaikan ke 17")
          PY

          echo "Project extracted and Java/Kotlin target fixed"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd KasirSayuran
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirSayuran-APK
          path: KasirSayuran/app/build/outputs/apk/debug/app-debug.apk
